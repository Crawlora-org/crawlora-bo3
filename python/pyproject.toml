[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-bo3"
version = "0.1.0"
description = "Crawlora BO3.gg API client with 28 endpoints for Counter-Strike and Valorant matches, teams, players, tournaments, rankings, news, and statistics"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "bo3", "bo3-gg", "bo3-api", "bo3-gg-api", "bo3-scraper", "bo3-gg-scraper", "bo3-data", "bo3-gg-data", "bo3-teams", "bo3-players", "bo3-tournaments", "bo3-rankings", "bo3-news", "bo3-statistics"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=bo3-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=bo3-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-bo3"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_bo3"]

[tool.setuptools.package-data]
"crawlora_bo3" = ["py.typed", "*.pyi"]
